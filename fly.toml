# fly.toml app configuration file generated for lifter on 2026-07-27T16:55:39+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lifter'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  LIFT_DB = '/data/lift.db'
  PORT = '3001'

[[mounts]]
  source = 'lift_data'
  destination = '/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
